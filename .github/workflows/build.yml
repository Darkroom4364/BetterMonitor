name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build:
    needs: lint
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build App
        run: |
          xcodebuild build \
            -project BetterMonitor.xcodeproj \
            -scheme BetterMonitor \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build CLI
        run: |
          xcodebuild build \
            -project BetterMonitor.xcodeproj \
            -target BetterMonitorCLI \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Hostless CLI Tests
        run: |
          SOURCE_MUTATING_BUILD_PHASES=NO xcodebuild test \
            -project BetterMonitor.xcodeproj \
            -scheme BetterMonitorCLI \
            -derivedDataPath "$RUNNER_TEMP/BetterMonitorCLITestsDerivedData" \
            -destination "platform=macOS,arch=$(uname -m)" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project BetterMonitor.xcodeproj \
            -scheme BetterMonitor \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath BetterMonitor.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Test Coverage Checker
        if: matrix.os == 'macos-15'
        run: python3 -m unittest scripts/test_check_coverage.py

      - name: Check Code Coverage
        if: matrix.os == 'macos-15'
        run: |
          python3 scripts/check_coverage.py \
            BetterMonitor.xcresult \
            --target BetterMonitor.app \
            --minimum 9.17

      - name: Upload test result bundle
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: BetterMonitor-xcresult-macos-15
          path: BetterMonitor.xcresult
          if-no-files-found: error
